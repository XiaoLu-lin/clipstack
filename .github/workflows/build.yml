name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest   # Apple Silicon (aarch64) .app / .dmg
            target: aarch64-apple-darwin
          - platform: windows-latest # Windows x64 .msi / .exe
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux 才需要系统依赖；macOS / Windows 由镜像自带
      - name: Install frontend dependencies
        run: pnpm install

      - name: Build & bundle
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }}
        env:
          # 自动更新需对更新包签名；私钥由仓库 Secrets 提供（不入库）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # Tauri 的 ad-hoc 签名资源封印不完整，直接分发会报"已损坏"，需递归重签
      - name: Re-sign macOS app (fix ad-hoc seal)
        if: matrix.platform == 'macos-latest'
        run: |
          APP_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          DMG_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          codesign --force --deep --sign - "$APP_DIR/ClipStack.app"
          # 重签后用"中转目录 + Applications 软链接"重建 dmg：
          # 既保留有效签名，又恢复标准的"拖到应用程序"安装界面
          # （直接用 -srcfolder <app> 会丢掉 Tauri 默认 dmg 里的 Applications 拖放链接）
          STAGE=$(mktemp -d)
          cp -R "$APP_DIR/ClipStack.app" "$STAGE/ClipStack.app"
          ln -s /Applications "$STAGE/Applications"
          DMG=$(ls "$DMG_DIR"/*.dmg)
          hdiutil create -volname ClipStack -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          rm -rf "$STAGE"

      # Windows: 仅在配置了 WINDOWS_PFX_BASE64 + WINDOWS_PFX_PASSWORD 时签名；否则跳过
      # （Windows 无免费 ad-hoc，未签名包仍可安装，仅 SmartScreen 会提示"仍要运行"）
      - name: Sign Windows binaries (optional)
        if: matrix.platform == 'windows-latest'
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_PFX_BASE64) {
            Write-Host "::notice::未配置 WINDOWS_PFX_BASE64，跳过 Windows 签名"
            exit 0
          }
          $env:WINDOWS_PFX_BASE64 | Out-File -Encoding ascii pfx.b64
          certutil -decode pfx.b64 cert.pfx
          # 证书就绪后在此用 signtool 对 msi/exe 签名（需将 signtool 加入 PATH）
          Write-Host "检测到证书，待补全 signtool 签名步骤"

      # 上传产物，方便直接下载测试 / 手动发布 Release
      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: clipstack-macos
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: clipstack-windows
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
