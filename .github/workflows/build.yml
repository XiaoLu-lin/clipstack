name: Build & Release

# 触发条件：
#   1. 推送到 main/master 分支        → 仅构建并上传临时产物（Actions 里可下载，30 天有效）
#   2. 推送 v* 标签（如 v0.1.0）       → 自动构建并发布到 GitHub Release（永久下载页）
#   3. 手动在 Actions 页面触发
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 创建 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest    # Apple Silicon (aarch64) .dmg / .app
            target: aarch64-apple-darwin
          - platform: windows-latest  # Windows x64 .msi / .exe
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install

      # 构建并打包。打标签时 release=true 会把产物挂到 GitHub Release。
      - name: Build & bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          release: ${{ startsWith(github.ref, 'refs/tags/') }}
          tagName: ${{ github.ref_name }}
          releaseName: 'ClipStack ${{ github.ref_name }}'
          releaseBody: '下载下方 assets 中的 macOS（.dmg）或 Windows（.msi / .exe）安装包。'

      # 非标签推送：把产物作为 Artifact 上传，方便直接下载测试
      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos-latest' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: clipstack-macos
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: clipstack-windows
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
